<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — CYBER MUSIC</title>
<meta name="description" content="30 artigos editoriais: charts, Moçambique, Afrobeats e metodologia CYBER MUSIC.">
<link rel="canonical" href="https://mozalltech.github.io/An-ncio-/news.html">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
<div class="header-inner container">
<a href="index.html" class="logo"><span class="logo-icon">▶</span> CYBER MUSIC</a>
<nav class="nav-main" aria-label="Main">
<a href="index.html">Home</a>
<a href="charts.html">Charts</a>
<a href="news.html" class="active">News</a>
<a href="artists.html">Artists</a>
<a href="albums.html">Albums</a>
<a href="music.html">Music</a>
<a href="mozambique.html">Moçambique</a>
<a href="about.html">About</a>
</nav>
<button class="menu-toggle" aria-label="Menu">☰</button>
</div>
</header>
<div class="cyber-ticker" aria-hidden="true"><div class="ticker-track">
<span class="ticker-item"><span class="dot"></span> EDITORIAL NEWS · 30 ARTICLES</span>
</div></div>
<main class="main-content">
<section class="section container">
<h1 class="section-title">News</h1>
<p style="color:var(--text-muted);margin-bottom:2rem;max-width:640px;">Artigos de <code>data/news.json</code>. Imagens editoriais de plataforma usam fallback quando não há visual de UI.</p>
<div class="cards-grid" id="news-grid"><p style="color:#666">Loading news…</p></div>
</section>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>© 2026 Cyber Music</span><a href="index.html">Home</a></div></div></footer>
<script src="js/app.js" defer></script>
<script src="js/player.js" defer></script>
<script src="js/news.js" defer></script>
<script>
(async function(){
  try {
    const res = await fetch('data/news.json');
    const data = await res.json();
    const grid = document.getElementById('news-grid');
    const params = new URLSearchParams(location.search);
    const focus = params.get('article');
    grid.innerHTML = (data.articles || []).map(a => {
      const img = a.image
        ? '<img src="'+a.image+'" alt="'+(a.imageAlt||a.title)+'" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:.75rem;border:1px solid #1e1e2a">'
        : '<div style="width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#0a0a14,#12122a);border-radius:8px;margin-bottom:.75rem;display:flex;align-items:center;justify-content:center;color:#00e5ff;font-size:.85rem;border:1px solid #1e1e2a">CYBER MUSIC · Editorial</div>';
      const summary = a.summary || a.excerpt || '';
      const hl = focus && (a.id===focus || a.title===focus) ? 'outline:2px solid #00e5ff' : '';
      return '<article class="card" id="news-'+(a.id||'')+'" style="'+hl+'"><div class="card-body">'+img+
        '<div class="card-category">'+(a.category||'Editorial')+' · '+(a.date||'')+'</div>'+
        '<h2 class="card-title">'+a.title+'</h2>'+
        '<p style="color:var(--text-secondary);font-size:0.9rem;margin:0.6rem 0">'+summary.slice(0,200)+(summary.length>200?'…':'')+'</p>'+
        '</div></article>';
    }).join('');
    if (focus) {
      const el = document.getElementById('news-'+focus) || document.querySelector('[id^="news-"]');
      if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
    }
  } catch(e) {
    document.getElementById('news-grid').innerHTML = '<p>Could not load news data.</p>';
  }
})();
</script>
</body>
</html>
